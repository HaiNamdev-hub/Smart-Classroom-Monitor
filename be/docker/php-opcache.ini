; ==============================================================================
; Cấu hình OPcache cho Smart Classroom Monitor (PHP 8.2 Alpine)
; Sử dụng cho Production & Staging trong môi trường Docker Container
; ==============================================================================

[opcache]
; Bật OPcache cho web requests
opcache.enable=1

; Tắt cho CLI để các lệnh artisan/migrate/seed luôn thực thi code mới nhất
opcache.enable_cli=0

; Dung lượng bộ nhớ RAM dành cho lưu trữ bytecode PHP (64MB phù hợp với RAM 512MB - 1GB)
opcache.memory_consumption=64

; Bộ đệm lưu trữ chuỗi ký tự bất biến (interned strings)
opcache.interned_strings_buffer=16

; Số lượng file PHP tối đa được lưu cache bytecode (Laravel có ~3500-4500 file)
opcache.max_accelerated_files=10000

; Tỷ lệ lãng phí bộ nhớ tối đa trước khi trigger restart OPcache
opcache.max_wasted_percentage=10

; QUAN TRỌNG: Trong Docker image bất biến (immutable), không kiểm tra file thay đổi
; Loại bỏ hàng nghìn lệnh stat() I/O hệ thống trên mỗi request
opcache.validate_timestamps=0

; Giữ lại PHPDoc comments để các framework và thư viện reflection hoạt động bình thường
opcache.save_comments=1

; Bật tắt nhanh để giải phóng bộ nhớ
opcache.fast_shutdown=1
