; ==============================================================================
; Cấu hình PHP-FPM Pool cho Smart Classroom Monitor
; Thiết kế theo tài nguyên phần cứng (Memory-Safe Configuration)
; ==============================================================================

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; Mode dynamic giúp co giãn worker theo lưu lượng tải
pm = dynamic

; ------------------------------------------------------------------------------
; 1. Cấu hình cho Render Free Tier (512MB RAM - 0.1 vCPU Throttled):
; ------------------------------------------------------------------------------
; Nginx: ~15MB, Reverb: ~40MB, PHP Master: ~20MB -> Cố định: ~75MB
; Mỗi worker Laravel: ~45-55MB
; Với 4 workers: 4 * 55MB = 220MB -> Tổng RAM ~295MB (An toàn tuyệt đối dưới ngưỡng 512MB)
;
; pm.max_children = 4
; pm.start_servers = 1
; pm.min_spare_servers = 1
; pm.max_spare_servers = 2

; ------------------------------------------------------------------------------
; 2. Cấu hình cho Staging / Production 50 Sinh viên (1 vCPU, 1GB RAM - Gói Starter $7):
; ------------------------------------------------------------------------------
; Khả năng xử lý 8 requests song song, thời gian phản hồi API trung bình 50-150ms
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4

; Tự động tái khởi động worker sau 1000 requests để phòng tránh rò rỉ bộ nhớ (memory leak)
pm.max_requests = 1000

; Thời gian tối đa worker xử lý 1 request trước khi bị terminate
request_terminate_timeout = 60s

; Bắt log lỗi của PHP worker ra stderr của container
catch_workers_output = yes
decorate_workers_output = no
